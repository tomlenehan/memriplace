services:
  db:
    image: pgvector/pgvector:0.7.4-pg12
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: ${POSTGRES_DB:-memribox}
      POSTGRES_USER: ${POSTGRES_USER:-memribox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memribox-password}
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: ${INSTALL_DEV:-true}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-MemriPlace}
      DOMAIN: ${DOMAIN:-localhost}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      RUNNING_TESTS: ${RUNNING_TESTS:-false}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000}
      SECRET_KEY: ${SECRET_KEY:-local-secret-key-change-me}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:-admin@example.com}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-local-admin-password}
      USERS_OPEN_REGISTRATION: ${USERS_OPEN_REGISTRATION:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_PORT: ${SMTP_PORT:-587}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-memribox}
      POSTGRES_USER: ${POSTGRES_USER:-memribox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memribox-password}
      SENTRY_DSN: ${SENTRY_DSN:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_UPLOAD_BUCKET_NAME: ${AWS_UPLOAD_BUCKET_NAME:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-jev-latest}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime-2.1}
      OPENAI_NARRATION_REALTIME_MODEL: ${OPENAI_NARRATION_REALTIME_MODEL:-gpt-realtime-2.1-mini}
      OPENAI_REALTIME_VOICE: ${OPENAI_REALTIME_VOICE:-marin}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-transcribe}
      PUBLIC_SKY_ENABLED: ${PUBLIC_SKY_ENABLED:-true}
      MEMBERSHIPS_ENABLED: ${MEMBERSHIPS_ENABLED:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_ENDPOINT: ${LANGCHAIN_ENDPOINT:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_ENV: ${PINECONE_ENV:-}
    command: /start-reload.sh
    volumes:
      - ./backend:/app
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost/docs', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      target: development
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_PUBLIC_SKY_ENABLED: ${VITE_PUBLIC_SKY_ENABLED:-true}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_PUBLIC_SKY_ENABLED: ${VITE_PUBLIC_SKY_ENABLED:-true}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
      VITE_BACKEND_PROXY_TARGET: ${VITE_BACKEND_PROXY_TARGET:-http://backend}
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  app-db-data:
  frontend-node-modules:
